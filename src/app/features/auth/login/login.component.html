<div class="flex flex-col items-center justify-center min-h-screen bg-gray-50">
  <div class="bg-white shadow-md rounded-2xl p-6 w-80">
    <h2 class="text-xl font-semibold mb-4 text-center text-gray-700">Login</h2>

    <form (ngSubmit)="onLogin()" class="flex flex-col gap-3">
      <input
        [(ngModel)]="username"
        name="username"
        type="text"
        placeholder="Username"
        class="border rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none"
      />
      <input
        [(ngModel)]="password"
        name="password"
        type="password"
        placeholder="Password"
        class="border rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none"
      />

      <button
        type="submit"
        [disabled]="loading"
        class="bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition"
      >
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <p *ngIf="errorMsg" class="text-red-600 text-sm mt-3 text-center">
      {{ errorMsg }}
    </p>
  </div>
</div>
